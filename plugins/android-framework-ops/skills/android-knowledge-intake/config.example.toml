default_profile = "member_alias"

[paths]
codex_home = "$CODEX_HOME"
out_dir = "$CODEX_HOME/artifacts/android-knowledge-intake"

include_patches = true
incoming_schema_version = "1"
max_attachment_mb = 5
push_retries = 3
timezone = "Asia/Shanghai"

[profiles.member_alias]
member_alias = "member_alias"
member_name = "成员姓名"
role = "member"
allowed_modes = ["daily", "weekly", "patch"]
knowledge_repo_worktree = "$CODEX_HOME/worktrees/knowledge"
git_user_name = "成员姓名"
git_user_email = "member_alias@codex.local"

[profiles.admin_alias]
member_alias = "admin_alias"
member_name = "链路测试"
role = "admin"
allowed_modes = ["patch"]
knowledge_repo_worktree = "$CODEX_HOME/worktrees/knowledge"
git_user_name = "链路测试"
git_user_email = "admin_alias@codex.local"

# 普通成员 TOML 只保存身份和本地路径，绝不能写 token。AKBS endpoint resolver 提供 HTTP 上传入口。
# 每位成员必须通过受保护的进程环境显式配置安全上传 token；缺失时 doctor 和上传会在本地失败。
# 不要把 token 写入 TOML、Git、命令行、日志或聊天记录。
# AKBS HTTP 上传环境配置：
# CODEX_REPORT_AKBS_ENDPOINT_SUBMISSION_API_BASE_URL=http://<akbs-host>:8088/akbs/api
# CODEX_REPORT_AKBS_ENDPOINT_SUBMISSION_API_TOKEN=<由受保护配置通道注入，不要在此填写>
