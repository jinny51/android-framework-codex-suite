interface:
  display_name: "Android Knowledge Intake"
  short_description: "Shared member incoming kernel and compatibility entry"
  default_prompt: "Use $android-knowledge-intake for member first-time migration, plugin update checks, config migration, doctor checks, and daily/weekly/patch compatibility commands through the shared incoming kernel. Prefer $android-daily-report-intake, $android-weekly-report-intake, or $android-framework-patch-intake for new business package generation. Do not use it for local knowledge curation."

policy:
  allow_implicit_invocation: true
