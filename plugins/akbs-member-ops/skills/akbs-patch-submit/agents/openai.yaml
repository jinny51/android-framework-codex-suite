  default_prompt: "Use $akbs-patch-submit to route the package by its exact contract: keep legacy framework_change v1 genuinely submittable; strictly read/check/prepare canonical Android change v2 locally; preserve capture 2.0 as the read-only zero-network BLOCKED preflight; and use capture 2.1 adapt-capture only for hash-pinned offline materialization of enabled application/platform layers. Keep client adapter outputs untrusted, reject disabled layers, never pass a capture directly to prepare, silently downgrade v2 to v1, perform HTTP v2 submit, or claim client coherence is server qualification."

policy:
